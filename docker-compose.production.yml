name: rebequi

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rebequi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - rebequi-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rebequi-network]

  migrator:
    image: ${MIGRATOR_IMAGE_REF:?MIGRATOR_IMAGE_REF is required}
    profiles: [tools]
    env_file: [.env.production]
    restart: "no"
    logging: *bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "scripts/migrate-deploy.sh"]
    networks: [rebequi-network]

  api:
    image: ${API_IMAGE_REF:?API_IMAGE_REF is required}
    container_name: rebequi-api
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *bounded-logging
    volumes:
      - rebequi-uploads:/app/uploads
      - rebequi-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [rebequi-network]

  web:
    image: ${WEB_IMAGE_REF:?WEB_IMAGE_REF is required}
    container_name: rebequi-web
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:3190:80"]
    restart: unless-stopped
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [rebequi-network]

volumes:
  rebequi-postgres-data:
    name: rebequi-postgres-data
    external: true
  rebequi-uploads:
    name: rebequi-uploads
    external: true
  rebequi-logs:
    name: rebequi-logs
    external: true

networks:
  rebequi-network:
    name: rebequi-network
