map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}

map $uri $pwa_install_redirect {
    ~^/painel-cliente/instalar/?$ /apps/cliente/instalar/;
    ~^/painel-lojista/instalar/?$ /apps/vendas/instalar/;
    ~^/painel-lojista/painel/entregas/instalar/?$ /apps/entregas/instalar/;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 55m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ^~ /api/channels/oauth/ {
        access_log off;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location ^~ /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Cache static assets
    # This URL is an SPA route even though the manifest creates a real directory.
    location = /parceiros/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }
    location = /parceiros/sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /parceiros/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /driver-sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/apps/entregas" always;
        try_files $uri =404;
    }
    location = /customer-sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/apps/cliente" always;
        try_files $uri =404;
    }
    location = /seller-sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/apps/vendas" always;
        try_files $uri =404;
    }
    location = /aplicativos {
        add_header Cache-Control "no-store" always;
        try_files /aplicativos/index.html =404;
    }
    location ~ ^/aplicativos/(cliente|vendedor|entregas)/manifest\.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~ ^/aplicativos/(cliente|vendedor|entregas)/install\.js$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~ ^/aplicativos/(cliente|vendedor|entregas)/(icon.*\.(png|webp)|favicon\.ico)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    # Static installation pages must be public even when their app needs login.
    location ~ ^/(painel-cliente|painel-lojista|painel-lojista/painel/entregas)/instalar/?$ {
        add_header Cache-Control "no-store" always;
        return 302 $pwa_install_redirect;
    }
    location ~ ^/apps/(cliente|vendas|entregas)/instalar/?$ {
        add_header Cache-Control "no-store" always;
        try_files $uri/index.html $uri/ /index.html;
    }
    location ~ ^/apps/(cliente|vendas|entregas)(/|$) {
        add_header Cache-Control "no-store" always;
        try_files /apps/$1/index.html =404;
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    # The customer installer creates a real directory next to this SPA route.
    location = /painel-cliente {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /painel-cliente/ {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /painel-lojista {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /painel-lojista/ {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /painel-lojista/painel/entregas {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /painel-lojista/painel/entregas/ {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /painel-lojista/painel {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /painel-lojista/painel/ {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /motoristas/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML entrypoint. It must always point to the newest hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
