name: Build and Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running migration or deployment.
concurrency:
  group: rebequi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VPS_HOST: 72.60.10.108
  VPS_USER: root

jobs:
  validate:
    name: Tests and infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check texts, shared types and API
        run: |
          npm run check:texts
          npm run build --workspace=packages/shared
          npm run lint --workspace=apps/backend
          npm run test --workspace=apps/backend
          npm run lint --workspace=apps/frontend
          npx tsc --noEmit --project apps/frontend/tsconfig.app.json
      - name: Check deployment scripts
        run: |
          bash -n scripts/deploy-production.sh
          bash -n scripts/test-production-images.sh
          shellcheck scripts/deploy-production.sh scripts/test-production-images.sh
          node scripts/check-production-config.mjs

  build-backend:
    name: Build API and migration images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.refs.outputs.api }}
      migrator: ${{ steps.refs.outputs.migrator }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "base=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build migrator (shares the compiled backend with API)
        id: migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: migrator
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.names.outputs.base }}-migrator:${{ github.sha }}
          build-args: RELEASE_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=rebequi-migrator
          cache-to: type=gha,mode=max,scope=rebequi-migrator
      - name: Build API with cloud recognition
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: production
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.names.outputs.base }}-api:${{ github.sha }}
          build-args: RELEASE_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: |
            type=gha,scope=rebequi-api
            type=gha,scope=rebequi-migrator
          cache-to: type=gha,mode=max,scope=rebequi-api
      - name: Immutable image references
        if: github.event_name != 'pull_request'
        id: refs
        env:
          IMAGE_BASE: ${{ steps.names.outputs.base }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
        run: |
          echo "api=$IMAGE_BASE-api@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "migrator=$IMAGE_BASE-migrator@$MIGRATOR_DIGEST" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build frontend image (parallel with backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      web: ${{ steps.refs.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Image name
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "web=ghcr.io/${REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build frontend
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.names.outputs.web }}:${{ github.sha }}
          build-args: RELEASE_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=rebequi-web
          cache-to: type=gha,mode=max,scope=rebequi-web
      - name: Immutable image reference
        if: github.event_name != 'pull_request'
        id: refs
        env:
          IMAGE_NAME: ${{ steps.names.outputs.web }}
          DIGEST: ${{ steps.web.outputs.digest }}
        run: echo "web=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

  integration:
    name: Validate production images in an isolated database
    if: github.event_name != 'pull_request'
    needs: [validate, build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Install real deploy prerequisites for the rollback test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx certbot
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser validation tools
        run: |
          npm ci --prefix tests/product --ignore-scripts --no-audit --no-fund
          npm run install:browser --prefix tests/product
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Migrations, bootstrap, OCR, auth, persistence and backup/restore
        env:
          API_IMAGE_REF: ${{ needs.build-backend.outputs.api }}
          MIGRATOR_IMAGE_REF: ${{ needs.build-backend.outputs.migrator }}
          WEB_IMAGE_REF: ${{ needs.build-frontend.outputs.web }}
          RELEASE_VERSION: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: bash scripts/test-production-images.sh
      - name: Product browser evidence
        if: always()
        # Evidence storage is optional; test failures still block deployment.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: product-browser-evidence
          path: tests/product/artifacts
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    name: Pull GHCR images and deploy to VPS
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-backend, build-frontend, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://www.rebequi.com.br
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH and check credentials
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          test -n "$SSHPASS" || { echo 'Missing existing VPS_PASSWORD secret.' >&2; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 scripts/deploy-known-hosts ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host rebequi-vps
              HostName $VPS_HOST
              User $VPS_USER
              StrictHostKeyChecking yes
              ConnectTimeout 20
              ServerAliveInterval 15
              ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config
      - name: Create small deployment bundle (no application source)
        env:
          API_IMAGE_REF: ${{ needs.build-backend.outputs.api }}
          MIGRATOR_IMAGE_REF: ${{ needs.build-backend.outputs.migrator }}
          WEB_IMAGE_REF: ${{ needs.build-frontend.outputs.web }}
          RELEASE_VERSION: ${{ github.sha }}
        run: |
          printf 'API_IMAGE_REF=%s\nMIGRATOR_IMAGE_REF=%s\nWEB_IMAGE_REF=%s\nRELEASE_VERSION=%s\n' \
            "$API_IMAGE_REF" "$MIGRATOR_IMAGE_REF" "$WEB_IMAGE_REF" "$RELEASE_VERSION" > .images.env
          tar -czf "$RUNNER_TEMP/rebequi-deploy.tar.gz" \
            docker-compose.production.yml scripts/deploy-production.sh .images.env
      - name: Upload deployment bundle
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sshpass -e ssh rebequi-vps "mkdir -p /opt/rebequi/releases/$RELEASE_ID"
          sshpass -e scp "$RUNNER_TEMP/rebequi-deploy.tar.gz" "rebequi-vps:/opt/rebequi/releases/$RELEASE_ID/bundle.tar.gz"
          sshpass -e ssh rebequi-vps \
            "tar -xzf /opt/rebequi/releases/$RELEASE_ID/bundle.tar.gz -C /opt/rebequi/releases/$RELEASE_ID"
      - name: Deploy (temporary GHCR authentication over SSH stdin)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | sshpass -e ssh rebequi-vps \
            "bash /opt/rebequi/releases/$RELEASE_ID/scripts/deploy-production.sh '$GHCR_USER'"
      - name: Verify public HTTPS
        run: |
          curl -fsS --retry 3 --max-time 15 https://rebequi.com.br/api/health | grep -q '"status":"ok"'
          curl -fsS --retry 3 --max-time 15 https://www.rebequi.com.br/health
